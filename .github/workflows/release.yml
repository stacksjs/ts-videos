name: CI

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Pantry
        uses: home-lang/pantry/packages/action@main

      - name: Install Dependencies
        run: bun install

      - name: Build packages
        run: bun run build

      # 0.3.x is a maintenance line: publish it under its own tag so npm's latest stays on 0.4.
      - name: Publish to npm
        run: pantry publish --npm --access public --tag release-0.3 './packages/*' '.'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        run: bunx changelogithub
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Attach Binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/vidx-linux-x64.zip
            bin/vidx-linux-arm64.zip
            bin/vidx-windows-x64.zip
            bin/vidx-darwin-x64.zip
            bin/vidx-darwin-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
